name: Escaneo diario

on:
  schedule:
    # Lunes a viernes 21:30 UTC = 30-90 min tras el cierre de Wall Street
    # (22:30 hora de España en invierno, 23:30 en verano). GitHub puede retrasarlo unos minutos.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar escáner
        run: python -m scanner.main

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(date -u +%Y-%m-%d)"
            git push
          fi
